services:
  - type: web
    name: gift-selection-catalog-backend
    env: java
    plan: free
    buildCommand: cd backend && chmod +x mvnw && ./mvnw clean package -DskipTests
    startCommand: cd backend && java -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DOCKER_COMPOSE_ENABLED
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gift-selection-catalog-db
          property: connectionString

databases:
  - name: gift-selection-catalog-db
    plan: free
