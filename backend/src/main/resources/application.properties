spring.application.name=backend

# --- Docker Compose (local dev: auto-start PostgreSQL) ---
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start-only
spring.docker.compose.readiness.wait=always

# --- DB ---
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:mydatabase}
spring.datasource.username=${DATABASE_USERNAME:myuser}
spring.datasource.password=${DATABASE_PASSWORD:secret}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true

# --- API base ---
server.port=${PORT:8080}
server.servlet.context-path=/api

# --- JWT ---
app.security.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
app.security.jwt.issuer=gift-selection-catalog
app.security.jwt.access-token-ttl=PT2H

# --- CORS (comma-separated origins) ---
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,https://gift-selection-catalog.onrender.com