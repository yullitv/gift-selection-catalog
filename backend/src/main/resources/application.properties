spring.application.name=backend

# --- DB (local docker-compose) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true

# --- API base ---
server.servlet.context-path=/api

# --- JWT (HMAC) ---
# IMPORTANT: store this via env var in real deployments
app.security.jwt.secret=change-me-change-me-change-me-change-me
app.security.jwt.issuer=gift-selection-catalog
app.security.jwt.access-token-ttl=PT2H
