spring.application.name=backend

# --- Docker Compose ---
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:false}
spring.docker.compose.file=compose.yaml

# --- DB ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${DATABASE_USERNAME:myuser}
spring.datasource.password=${DATABASE_PASSWORD:secret}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true

# --- API base ---
server.servlet.context-path=/api

# --- JWT ---
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=gift-selection-catalog
app.security.jwt.access-token-ttl=PT2H